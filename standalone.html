<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>供应商管理系统</title>
  <style>
/* ========== 供应商管理系统 · 现代主题样式 v2 ========== */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #e6eaf2;
  --border-strong: #cdd6e4;
  --text: #1a2233;
  --text-secondary: #667085;
  --primary: #2f6bff;
  --primary-soft: #eaf1ff;
  --danger: #e5484d;
  --success: #16a34a;
  --warning: #e8842f;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-md: 0 4px 14px rgba(16, 24, 40, .07);
  --shadow-lg: 0 14px 40px rgba(16, 24, 40, .14);
  --sidebar-w: 232px;
  --sidebar-w-collapsed: 64px;
  --topbar-h: 64px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

/* 现代细滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: #c6cfdd; border-radius: 8px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background-color: #9aa8bb; }
::-webkit-scrollbar-track { background: transparent; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; height: 100vh; overflow: hidden; }

a { color: inherit; }

/* ---------- 侧边栏 ---------- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width .25s cubic-bezier(.4, 0, .2, 1);
  flex-shrink: 0;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar.collapsed .logo-text,
.sidebar.collapsed .nav-item span:not(.nav-icon),
.sidebar.collapsed .sidebar-footer { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }

.sidebar-logo {
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 11px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
}
.logo-mark {
  width: 36px; height: 36px; border-radius: 11px;
  background-image: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)), var(--primary);
  background-color: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px; flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(47, 107, 255, .3);
}
.logo-text { font-weight: 700; font-size: 17px; white-space: nowrap; letter-spacing: .2px; }

.sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 14px; border-radius: 11px;
  color: var(--text-secondary); text-decoration: none;
  margin-bottom: 4px; transition: background .18s, color .18s, box-shadow .18s;
  white-space: nowrap; font-size: 14.5px; font-weight: 500;
  position: relative;
}
.nav-item:hover { background: var(--primary-soft); color: var(--primary); }
.nav-item.active {
  background: var(--primary-soft); color: var(--primary); font-weight: 600;
  box-shadow: inset 3px 0 0 var(--primary);
}
.nav-icon { width: 22px; text-align: center; font-size: 16px; flex-shrink: 0; }

.sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); }
.version-tag { font-size: 12.5px; color: var(--text-secondary); }

/* ---------- 主区域 ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: var(--topbar-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 22px; flex-shrink: 0;
}
.icon-btn {
  background: none; border: none; font-size: 19px; cursor: pointer;
  color: var(--text-secondary); width: 38px; height: 38px; border-radius: 11px;
  flex-shrink: 0; transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--primary-soft); color: var(--primary); }

.breadcrumb { font-weight: 700; font-size: 18px; white-space: nowrap; letter-spacing: .2px; }

.global-search-wrap { position: relative; flex: 1; max-width: 400px; }
.global-search {
  width: 100%; padding: 9px 14px 9px 14px;
  border: 1px solid var(--border); border-radius: 11px;
  background: var(--bg); color: var(--text); outline: none; font-size: 14px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.global-search:focus {
  border-color: var(--primary); background: var(--surface);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
}
.search-results {
  position: absolute; top: 46px; left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  box-shadow: var(--shadow-lg); display: none; z-index: 50;
  max-height: 340px; overflow-y: auto;
}
.search-results.show { display: block; }
.search-group { padding: 10px 14px 4px; font-size: 12.5px; color: var(--text-secondary); font-weight: 600; }
.search-item {
  padding: 10px 14px; cursor: pointer; font-size: 14px;
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
.search-item:hover { background: var(--primary-soft); }
.search-item .si-sub { color: var(--text-secondary); font-size: 12.5px; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.user-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
.user-select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 14px; outline: none;
  max-width: 140px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.user-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
}

.content { flex: 1; overflow-y: auto; padding: 26px; }

/* ---------- 通用按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 11px; font-size: 14px;
  cursor: pointer; border: 1px solid transparent; line-height: 1.4;
  white-space: nowrap; font-weight: 600;
  transition: box-shadow .18s, transform .12s, background .18s, color .18s, border-color .18s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background-color: var(--primary);
  background-image: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0));
  color: #fff; font-weight: 600;
  box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 32%, transparent);
}
.btn-primary:hover {
  filter: brightness(1.06);
  box-shadow: 0 5px 14px color-mix(in srgb, var(--primary) 40%, transparent);
  transform: translateY(-1px);
}
.btn-ghost {
  background: var(--surface); color: var(--text); border-color: var(--border);
  box-shadow: var(--shadow-sm);
}
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: #fdeaea; color: var(--danger); }
.btn-danger:hover { background: #fad5d5; }
.btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
.btn-outline:hover { background: var(--primary-soft); }
.btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* ---------- 页面头 & 工具栏 ---------- */
.page-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.page-title { font-size: 23px; font-weight: 800; letter-spacing: .2px; }
.page-sub { font-size: 13.5px; color: var(--text-secondary); margin-top: 5px; font-weight: 400; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.toolbar .spacer { flex: 1; }
.search-box input {
  padding: 9px 14px; border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface); color: var(--text); font-size: 14px; outline: none;
  min-width: 200px;
  transition: border-color .15s, box-shadow .15s;
}
.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
}

.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.filter-item { display: flex; flex-direction: column; gap: 4px; }
.filter-item > span { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
.filter-item select, .filter-item input {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 14px; outline: none;
  min-width: 120px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.filter-item select:focus, .filter-item input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
}

/* ---------- 卡片 & 统计 ---------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px; cursor: default;
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.stat-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), color-mix(in srgb, var(--primary) 20%, transparent));
  opacity: .85;
}
.stat-card.clickable { cursor: pointer; transition: box-shadow .2s, transform .2s; }
.stat-card.clickable:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
.stat-label { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
.stat-value { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: .2px; }
.stat-value .unit { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.stat-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 20px; margin-bottom: 20px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.card-title { font-size: 16.5px; font-weight: 700; letter-spacing: .2px; }

/* ---------- 徽章 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  line-height: 1.7; white-space: nowrap;
}
.badge.gray   { background: #eef1f5; color: #5b6b7d; }
.badge.blue   { background: #e7f0ff; color: #2f6bff; }
.badge.green  { background: #e4f6ec; color: #1e9e5a; }
.badge.red    { background: #fdeaea; color: #e5484d; }
.badge.orange { background: #fff0e0; color: #e8842f; }
.badge.purple { background: #f0eaff; color: #7c5cff; }

.tag {
  display: inline-block; padding: 2px 9px; border-radius: 7px; font-size: 12px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary);
  margin: 1px 2px 1px 0;
}

/* ---------- 表格 ---------- */
.table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow-sm);
}
.data-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.data-table th, .data-table td {
  padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table thead th {
  background: #f7f9fc; color: var(--text-secondary); font-weight: 700; font-size: 13.5px;
  letter-spacing: .4px;
  white-space: nowrap; position: sticky; top: 0; z-index: 2;
  border-bottom: 2px solid var(--border);
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background .12s; }
.data-table tbody tr:hover { background: #f5f8ff; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table td .cell-sub { font-size: 12px; color: var(--text-secondary); }
.row-actions { display: flex; gap: 6px; white-space: nowrap; }
.link-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 13px; padding: 3px 5px; border-radius: 6px; font-weight: 500; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--danger); }

.cell-input, .cell-select {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.cell-input { width: 74px; }
.cell-input:focus, .cell-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 14%, transparent);
}

/* ---------- 看板 ---------- */
.kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.kanban-col { background: #eef1f7; border-radius: var(--radius); padding: 14px; min-height: 120px; }
.kanban-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; font-size: 14.5px; font-weight: 700; color: var(--text-secondary);
}
.kanban-count {
  font-size: 12.5px; background: var(--surface); border: 1px solid var(--border);
  padding: 2px 10px; border-radius: 999px; font-weight: 600;
}
.kanban-cards { display: flex; flex-direction: column; gap: 10px; }
.kanban-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s, transform .18s;
}
.kanban-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kanban-card .kc-title { font-weight: 700; font-size: 14px; margin-bottom: 7px; }
.kanban-card .kc-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
.kanban-card .kc-foot { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 6px; }
.kanban-empty { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 22px 0; }

/* ---------- 表单 ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
.form-grid .full { grid-column: 1 / -1; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field > label { font-size: 13.5px; color: var(--text-secondary); font-weight: 500; }
.form-field .req { color: var(--danger); margin-left: 2px; }
.form-field .label-hint { font-weight: 400; color: var(--text-secondary); opacity: .75; font-size: 12px; margin-left: 6px; }
.form-field input[type="text"],
.form-field input[type="number"],
.form-field input[type="date"],
.form-field input[type="month"],
.form-field select,
.form-field textarea {
  padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 14px; outline: none; width: 100%;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.form-field textarea { resize: vertical; min-height: 64px; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
}

.checkbox-grid { display: flex; flex-wrap: wrap; gap: 9px; }
.check-item {
  display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--text-secondary); user-select: none;
  transition: all .15s;
}
.check-item input { display: none; }
.check-item.on {
  border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 10%, transparent);
}

.radio-row { display: flex; gap: 16px; flex-wrap: wrap; }
.radio-row label { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }

/* 文件 */
.file-list { display: flex; flex-direction: column; gap: 7px; }
.file-chip {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 13px;
}
.file-chip .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .fsize { color: var(--text-secondary); font-size: 12px; }
.file-chip a { color: var(--primary); text-decoration: none; font-size: 13px; }
.file-add {
  display: inline-flex; align-items: center; gap: 5px; padding: 9px 14px;
  border: 1.5px dashed var(--border-strong); border-radius: 10px; cursor: pointer; font-size: 13px;
  color: var(--text-secondary); background: var(--surface);
  transition: all .15s;
}
.file-add:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.file-add input { display: none; }
.file-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* 星级 */
.stars { display: inline-flex; gap: 2px; }
.star { cursor: pointer; font-size: 19px; color: #d6dce4; transition: color .1s, transform .1s; }
.star:hover { transform: scale(1.15); }
.star.on { color: #f5a623; }

/* ---------- 弹窗 ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 20, 25, .45);
  backdrop-filter: blur(2px);
  opacity: 0; visibility: hidden; transition: opacity .22s, visibility .22s; z-index: 90;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%);
  width: 720px; max-width: 94vw; max-height: 88vh;
  background: var(--surface); border-radius: 18px; border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transition: opacity .22s, transform .22s, visibility .22s; z-index: 91;
}
.modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
.modal.sm { width: 460px; }
.modal-head {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.modal-title { font-size: 18px; font-weight: 800; letter-spacing: .2px; }
.modal-close { font-size: 17px; }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 16px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0;
}

/* ---------- 居中确认弹窗 ---------- */
.confirm-dialog { text-align: center; padding: 6px 0; }
.confirm-text { font-size: 15px; color: var(--text); line-height: 1.6; }

/* ---------- 空状态 ---------- */
.empty-state { text-align: center; padding: 64px 20px; color: var(--text-secondary); }
.empty-icon { font-size: 44px; margin-bottom: 14px; opacity: .45; }
.empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
.empty-desc { font-size: 13.5px; margin-bottom: 18px; }

/* ---------- 图表 ---------- */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; }
.chart-widget {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px; position: relative;
}
.chart-widget .widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.chart-widget .widget-title { font-size: 15.5px; font-weight: 700; }
.chart-widget .widget-del { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 15px; }
.chart-widget .widget-del:hover { color: var(--danger); }

.bar-chart { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.bar-label { width: 90px; text-align: right; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.bar-track { flex: 1; height: 22px; background: var(--bg); border-radius: 8px; overflow: hidden; }
.bar-fill {
  height: 100%;
  background-color: var(--primary);
  background-image: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
  border-radius: 8px; min-width: 2px; transition: width .4s ease;
}
.bar-val { width: 56px; color: var(--text); font-variant-numeric: tabular-nums; flex-shrink: 0; font-weight: 600; }

.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut { width: 132px; height: 132px; border-radius: 50%; flex-shrink: 0; }
.donut-legend { display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.donut-legend .dl-row { display: flex; align-items: center; gap: 7px; }
.donut-legend .dl-dot { width: 10px; height: 10px; border-radius: 4px; flex-shrink: 0; }
.donut-legend .dl-val { margin-left: auto; color: var(--text-secondary); }

.metric-big { font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: .2px; }

/* ========== 供应商管理系统 · 完整业务逻辑 ========== */
(function () {
  "use strict";

  /* ================= 工具函数 ================= */
  function $(id) { return document.getElementById(id); }

  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmtNum(n) {
    n = Number(n) || 0;
    return n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }
  function money(n, cur) { return (cur === "USD" ? "$" : "¥") + fmtNum(n); }
  function starStr(n) {
    n = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
    return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  }
  function toast(msg) {
    var t = el("div", "toast", msg);
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add("show"); }, 10);
    setTimeout(function () { t.classList.remove("show"); setTimeout(function () { t.remove(); }, 300); }, 1800);
  }
  function copyText(txt, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { cb && cb(); }, function () { fallbackCopy(txt, cb); });
    } else { fallbackCopy(txt, cb); }
  }
  function fallbackCopy(txt, cb) {
    var ta = el("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove(); cb && cb();
  }
  /* ---------- 附件云端存储（cloud.storage runtime 桶） ---------- */
  function fileStoragePrefix() {
    var uid = (session && session.user && (session.user.id || session.user.sub)) || "anon";
    return "users/" + String(uid).replace(/[^A-Za-z0-9._-]/g, "_") + "/spm";
  }
  function hasCloudStorage() { return !!(cloud && cloud.storage); }
  function b64ToBlob(b64, type) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: type || "application/octet-stream" });
  }
  // 取附件 DataURL：优先内存缓存；storagePath 则从云端下载（结果缓存在 f.dataUrl）
  function fileDataUrlAsync(f) {
    if (f.dataUrl) return Promise.resolve(f.dataUrl);
    if (f.storagePath && hasCloudStorage()) {
      return cloud.storage.runtime.download(f.storagePath).then(function (res) {
        if (res.error || !res.data) return null;
        var blob = res.data;
        return new Promise(function (resolve) {
          var r = new FileReader();
          r.onload = function () { f.dataUrl = r.result; resolve(r.result); };
          r.onerror = function () { resolve(null); };
          r.readAsDataURL(blob);
        });
      }).catch(function () { return null; });
    }
    return Promise.resolve(null);
  }
  // 上传文件到云端存储；成功返回 storagePath，失败返回 null（降级为本地 base64）
  function uploadFileToStorage(uploadDir, file) {
    if (!hasCloudStorage() || !uploadDir) return Promise.resolve(null);
    var ext = String(file.name || "").toLowerCase().split(".").pop().replace(/[^a-z0-9]/g, "").slice(0, 10);
    var path = fileStoragePrefix() + "/" + uploadDir + "/" + uid() + (ext ? "." + ext : "");
    return cloud.storage.runtime.upload(path, file).then(function (res) {
      if (!res.error && res.data) return path;
      return null;
    }).catch(function () { return null; });
  }
  function readFiles(input, uploadDir, cb) {
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) { cb([]); return; }
    var out = new Array(files.length), pending = 0;
    function done() { pending--; if (pending <= 0) cb(out.filter(function (x) { return !!x; })); }
    files.forEach(function (f, idx) {
      if (f.size > 5 * 1024 * 1024) { toast("文件「" + f.name + "」超过 5MB，已跳过"); return; }
      pending++;
      var meta = { name: f.name, size: f.size, type: f.type };
      function fallback() {
        var r = new FileReader();
        r.onload = function () { out[idx] = Object.assign({}, meta, { dataUrl: r.result }); done(); };
        r.onerror = function () { done(); };
        r.readAsDataURL(f);
      }
      uploadFileToStorage(uploadDir, f).then(function (path) {
        if (path) { out[idx] = Object.assign({}, meta, { storagePath: path }); done(); }
        else fallback();
      });
    });
  }
  function fmtSize(n) {
    n = n || 0;
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  var DEFAULT_CONFIG = {
    siteName: "供应商管理系统",
    logoMark: "供",
    primaryColor: "#2f6bff",
    theme: "light",
    projects: ["MC", "Nova", "MF", "C", "S", "K"],
    supplierCategories: ["美术", "素材", "音频", "外派", "本地化"],
    demandCategories: ["角色原画", "场景原画", "角色动画", "场景动画", "角色模型", "场景模型", "图标", "UI"],
    members: ["何捷", "于涛", "黄志鹏", "徐峰", "徐芝芝", "陈宇飞", "王薪清"],
    ourParties: ["大乐至简科技（北京）有限公司", "天天玩家科技（北京）有限公司", "成都天天玩家科技有限公司", "Happibits"],
    projectGroups: {}, // { 项目: [成员名, ...] }
    currentUser: "管理员"
  };

  var KEYS = {
    config: "spm_config_v1",
    suppliers: "spm_suppliers_v1",
    demands: "spm_demands_v1",
    contracts: "spm_contracts_v1",
    widgets: "spm_widgets_v1"
  };

  /* ================= 云服务配置 ================= */
  var CLOUD_CONFIG = {
    endpoint: "https://supplier-system-63852.app.workbuddy.host",
    oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
    publishableKey: "wbpk_UMoGSCv5mTQ3E6OUdsm2PE_ASkqHCufzge9Z3WxiWtWkT0GQvf9xZkq"
  };
  var cloud = null;
  var session = null;
  var cacheMeta = {};       // key -> 云端 updated_at（本地已知的最新值）
  var pendingSaves = {};    // key -> 待写入值
  var saveTimers = {};      // key -> 防抖定时器
  var syncTimer = null;
  var onboardApps = [];     // 待审核的自助入库申请

  /* ================= 数据层（云端共享 + 本地迁移源） ================= */
  function loadLocal(key, def) {
    try { var r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch (e) {}
    return def;
  }
  function hasLocalData() {
    return [KEYS.config, KEYS.suppliers, KEYS.demands, KEYS.contracts, KEYS.widgets].some(function (k) {
      return localStorage.getItem(k) != null;
    });
  }

  function cloudLoad(key, def) {
    return cloud.database.from("spm_state").select("data, updated_at").eq("key", key).maybeSingle()
      .then(function (res) {
        if (res.error) throw res.error;
        if (!res.data) return { value: def, meta: null };
        cacheMeta[key] = res.data.updated_at;
        return { value: res.data.data == null ? def : res.data.data, meta: res.data.updated_at };
      });
  }

  function debouncePersist(key) {
    if (saveTimers[key]) clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(function () {
      var val = pendingSaves[key];
      delete pendingSaves[key];
      delete saveTimers[key];
      persistNow(key, val);
    }, 600);
  }

  // 云端主数据瘦身：
  // 1) 已存云存储的附件（storagePath）不带 dataUrl 缓存；
  // 2) 尚未迁移的 base64 附件：dataUrl 不进主数据（避免请求体超限），打 _pendingUpload 标记，
  //    内容由 localStorage 备份 + 后台迁移到云存储保证（见 migrateFilesToStorage）
  function stripCachedDataUrls(val) {
    try {
      var obj = JSON.parse(JSON.stringify(val));
      (function walk(x) {
        if (Array.isArray(x)) { x.forEach(walk); return; }
        if (x && typeof x === "object") {
          if (x.storagePath && typeof x.dataUrl === "string") { delete x.dataUrl; delete x._pendingUpload; }
          else if (x.dataUrl && typeof x.dataUrl === "string" && typeof x.name === "string") {
            delete x.dataUrl;
            x._pendingUpload = true;
          }
          for (var k in x) walk(x[k]);
        }
      })(obj);
      return obj;
    } catch (e) { return val; }
  }
  function persistNow(key, val) {
    if (!cloud) return;
    cloud.database.from("spm_state")
      .upsert({ key: key, data: stripCachedDataUrls(val), updated_at: new Date().toISOString() })
      .select("updated_at")
      .then(function (res) {
        if (res.error) { toast("保存失败：" + (res.error.message || "云端异常")); return; }
        if (res.data && res.data[0]) cacheMeta[key] = res.data[0].updated_at;
        // 保存成功后顺带推进历史附件迁移（幂等，无待迁移附件时立即返回）
        setTimeout(migrateFilesToStorage, 1200);
      })
      .catch(function () { toast("保存失败：网络异常，请稍后重试"); });
  }

  function save(key, val) {
    pendingSaves[key] = val;
    debouncePersist(key);
  }

  /* ================= 应用状态 ================= */
  var config = loadLocal(KEYS.config, {});
  function mergeConfig() {
    var d = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    for (var k in d) { if (config[k] === undefined) config[k] = d[k]; }
  }
  mergeConfig();

  var suppliers = loadLocal(KEYS.suppliers, []);
  var demands = loadLocal(KEYS.demands, []);
  var contracts = loadLocal(KEYS.contracts, []);
  var widgets = loadLocal(KEYS.widgets, null);

  function migrateDemands() {
    // 数据迁移：为历史需求单补全 settlement 子结构
    demands.forEach(function (d) {
      if (!d.settlement) d.settlement = { completion: 0, settleFiles: [], invoiceFiles: [], confirmed: false };
      if (!d.attr) d.attr = "正式需求";
      if (!d.status) d.status = "未开始";
      if (d.quoteCurrency === undefined) d.quoteCurrency = "RMB";
      if (!Array.isArray(d.scheduleFiles)) d.scheduleFiles = [];
      if (d.totalManDays == null) d.totalManDays = "";
      // 发包月份按记录创建日期自动生成（保留已手动填写的值）
      if (!d.dispatchMonth && d.createdAt) d.dispatchMonth = String(d.createdAt).slice(0, 7);
    });
  }
  migrateDemands();

  // 合同流转状态（流程按钮依次推进）
  var FLOW_STEPS = ["未提审批", "已提审批", "已邮寄", "已归档"];
  function migrateContracts() {
    contracts.forEach(function (ct) {
      if (!ct.flowStatus || FLOW_STEPS.indexOf(ct.flowStatus) < 0) ct.flowStatus = "未提审批";
      if (!Array.isArray(ct.files)) ct.files = [];
      ["payeeName", "bankName", "bankAccount", "swiftCode"].forEach(function (k) {
        if (ct[k] == null) ct[k] = "";
      });
    });
  }
  migrateContracts();

  async function loadAllFromCloud() {
    var r1 = await cloudLoad(KEYS.config, {});
    var r2 = await cloudLoad(KEYS.suppliers, []);
    var r3 = await cloudLoad(KEYS.demands, []);
    var r4 = await cloudLoad(KEYS.contracts, []);
    var r5 = await cloudLoad(KEYS.widgets, null);
    config = r1.value || {};
    mergeConfig();
    config.currentUser = loadLocal("spm_current_user", "管理员");
    suppliers = r2.value || [];
    demands = r3.value || [];
    contracts = r4.value || [];
    widgets = r5.value == null ? null : r5.value;
    migrateDemands();
    migrateContracts();
  }

  async function migrateLocalToCloud() {
    var pairs = [
      [KEYS.config, config],
      [KEYS.suppliers, suppliers],
      [KEYS.demands, demands],
      [KEYS.contracts, contracts],
      [KEYS.widgets, widgets]
    ];
    for (var i = 0; i < pairs.length; i++) {
      if (localStorage.getItem(pairs[i][0]) != null && pairs[i][1] != null) {
        await cloud.database.from("spm_state").upsert({
          key: pairs[i][0], data: pairs[i][1], updated_at: new Date().toISOString()
        });
      }
    }
  }

  /* ================= 历史附件迁移（base64 → 云存储） ================= */
  var ATTACH_BACKUP_KEY = "spm_attach_backup_v1";
  var migrationBackup = null;

  function backupKeyOf(dir, f) { return dir + "|" + (f.name || "") + "|" + (f.size || 0); }
  function loadBackup() {
    if (!migrationBackup) {
      migrationBackup = loadLocal(ATTACH_BACKUP_KEY, {});
      if (!migrationBackup || typeof migrationBackup !== "object") migrationBackup = {};
    }
    return migrationBackup;
  }
  function persistBackup() {
    var bak = loadBackup();
    var n = 0; for (var k in bak) { n++; break; }
    try {
      if (n) localStorage.setItem(ATTACH_BACKUP_KEY, JSON.stringify(bak));
      else { localStorage.removeItem(ATTACH_BACKUP_KEY); migrationBackup = null; }
    } catch (e) { /* 本地存储满：备份失败时迁移过程会因 upload 成功才删数据，风险可控 */ }
  }
  function removeBackupEntry(dir, f) {
    var bak = loadBackup();
    var k = backupKeyOf(dir, f);
    if (bak[k]) { delete bak[k]; persistBackup(); }
  }

  // 收集所有附件组：[存储目录, 附件数组]
  function collectAttachments(out) {
    contracts.forEach(function (ct) { out.push(["contracts/" + ct.id, ct.files]); });
    demands.forEach(function (d) {
      out.push(["demands/" + d.id, d.scheduleFiles]);
      if (d.settlement) {
        out.push(["demands/" + d.id + "/settle", d.settlement.settleFiles]);
        out.push(["demands/" + d.id + "/invoice", d.settlement.invoiceFiles]);
      }
    });
    suppliers.forEach(function (sp) {
      out.push(["suppliers/" + sp.id, sp.introFiles]);

  // 启动时恢复：云端数据中 _pendingUpload 附件（内容被剥离）从本地备份回填 dataUrl
  function restorePendingAttachments() {
    var bak = loadBackup();
    var has = false; for (var k in bak) { has = true; break; }
    if (!has) return;
    var groups = [];
    collectAttachments(groups);
    groups.forEach(function (g) {
      (g[1] || []).forEach(function (f) {
        if (f._pendingUpload && !f.storagePath && !f.dataUrl) {
          var v = bak[backupKeyOf(g[0], f)];
          if (v) { f.dataUrl = v; delete f._pendingUpload; }
        }
      });
    });
  }

  // 历史 base64 附件迁移：上传到云存储并替换为 storagePath（后台静默执行）
  function migrateFilesToStorage() {
    if (window.__migRunning) return;
    if (!hasCloudStorage() || !session || !session.user || !(session.user.id || session.user.sub)) return;
    var groups = [];
    collectAttachments(groups);
    var targets = [];
    groups.forEach(function (g) {
      (g[1] || []).forEach(function (f) {
        if (!f.storagePath && f.dataUrl) targets.push({ f: f, dir: g[0], tries: 0 });
      });
    });
    if (!targets.length) return;
    window.__migRunning = true;
    // 备份所有待迁移附件内容到 localStorage（上传失败/中途刷新也不丢数据）
    var bak = loadBackup();
    var bakChanged = false;
    targets.forEach(function (t) {
      var k = backupKeyOf(t.dir, t.f);
      if (t.f.dataUrl && bak[k] !== t.f.dataUrl) { bak[k] = t.f.dataUrl; bakChanged = true; }
    });
    if (bakChanged) { persistBackup(); toast("正在同步 " + targets.length + " 个历史附件到云端（自动完成，期间可正常使用）"); }
    var changed = false;
    var removedKeys = [];
    function next() {
      var t = targets.shift();
      if (!t) {
        window.__migRunning = false;
        if (removedKeys.length) {
          removedKeys.forEach(function (k) { if (bak[k]) delete bak[k]; });
          persistBackup();
        }
        if (changed) { saveContracts(); saveDemands(); saveSuppliers(); }
        return;
      }
      var b64 = String(t.f.dataUrl || "").split(",")[1];
      if (!b64) { next(); return; }
      var ext = String(t.f.name || "").toLowerCase().split(".").pop().replace(/[^a-z0-9]/g, "").slice(0, 10);
      var path = fileStoragePrefix() + "/" + t.dir + "/" + uid() + (ext ? "." + ext : "");
      var blob = b64ToBlob(b64, t.f.type);

  /* ================= 排期报价表识别 ================= */
  function normalizeCellText(v) {
    if (v == null) return "";
    return String(v).replace(/\u00a0/g, " ").trim();
  }
  function excelSerialToDate(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 20000 || n > 80000) return "";
    var d = new Date(Math.round((n - 25569) * 86400 * 1000));
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  function parseDateValue(v) {
    if (v instanceof Date && !isNaN(v.getTime())) {
      return v.getFullYear() + "-" + String(v.getMonth() + 1).padStart(2, "0") + "-" + String(v.getDate()).padStart(2, "0");
    }
    if (typeof v === "number") return excelSerialToDate(v);
    var s = normalizeCellText(v);
    if (!s) return "";
    var m = s.match(/(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
    if (m) return m[1] + "-" + String(Number(m[2])).padStart(2, "0") + "-" + String(Number(m[3])).padStart(2, "0");
    m = s.match(/(\d{4})(\d{2})(\d{2})/);
    if (m && Number(m[2]) >= 1 && Number(m[2]) <= 12 && Number(m[3]) >= 1 && Number(m[3]) <= 31) return m[1] + "-" + m[2] + "-" + m[3];
    m = s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if (m) return m[3] + "-" + String(Number(m[1])).padStart(2, "0") + "-" + String(Number(m[2])).padStart(2, "0");
    return "";
  }
  function parseAmountValue(v) {
    if (typeof v === "number" && isFinite(v)) return { amount: String(v), currency: "RMB" };
    var s = normalizeCellText(v);
    if (!s) return null;
    var currency = /[$＄]|usd/i.test(s) ? "USD" : "RMB";
    var m = s.replace(/[,，\s]/g, "").match(/-?\d+(?:\.\d+)?/);
    if (!m) return null;
    return { amount: m[0], currency: currency };
  }
  // 排期报价表字段标签正则（scanInline 与横排表头共用）
  var SCHEDULE_LABEL_RE = "(?:开始时间|开始日期|开工日期|开工时间|DDL|deadline|最终提交日期|最终提交时间|最终提交|提交日期|提交时间|交稿日期|交稿时间|终稿日期|终稿时间|截止时间|截止日期|交付日期|交付时间|完工日期|完工时间|报价|总价|预算|金额|费用|总人天|人天|总工时|工时|工作量)";

  function matchFieldLabel(label) {
    var l = label.toLowerCase();
    if (/ddl|deadline|due\b|截止|交付|提交|交稿|终稿|完工/.test(l)) return "ddl";
    if (/开始/.test(l) && /时间|日期|日/.test(l)) return "dispatchDate";
    if (/人天|工时|工作量|man[- ]?day/.test(l)) return "totalManDays";
    if (/报价|金额|总价|价格|预算|费用|quote|price|total|amount/.test(l)) return "quoteAmount";
    return "";
  }
  function parseManDaysValue(v) {
    if (typeof v === "number" && isFinite(v)) return String(v);
    var s = normalizeCellText(v);
    if (!s) return "";
    var m = s.replace(/[,，\s]/g, "").match(/\d+(?:\.\d+)?/);
    return m ? m[0] : "";
  }
  function extractSchedule(rows) {

    function setOnce(key, val, currency) {
      if (out[key]) return;
      out[key] = val;
      if (currency === "USD") out.quoteCurrency = "USD";
      if (out.hits.indexOf(key) < 0) out.hits.push(key);
    }
    function scanInline(cellText) {
      var re = new RegExp("(" + SCHEDULE_LABEL_RE + ")\\s*[：:]\\s*([^：:]*?)(?=" + SCHEDULE_LABEL_RE + "\\s*[：:]|$)", "gi");
      var m;
      while ((m = re.exec(cellText))) {
        var key = matchFieldLabel(m[1]);
        var val = m[2].trim();
        if (!val) continue;
        if (key === "dispatchDate") { var ds = parseDateValue(val); if (ds) setOnce("dispatchDate", ds); }
        else if (key === "ddl") { var dl = parseDateValue(val); if (dl) setOnce("ddl", dl); }
        else if (key === "quoteAmount") { var am = parseAmountValue(val); if (am) setOnce("quoteAmount", am.amount, am.currency); }
        else if (key === "totalManDays") { var md = parseManDaysValue(val); if (md) setOnce("totalManDays", md); }
      }
    }
    (rows || []).forEach(function (row) {
      if (!row || !row.length) return;
      var key = matchFieldLabel(normalizeCellText(row[0]));
      if (key) {
        for (var i = 1; i < row.length; i++) {
          if (normalizeCellText(row[i]) === "") continue;
          if (key === "dispatchDate") { var ds = parseDateValue(row[i]); if (ds) setOnce("dispatchDate", ds); }
          else if (key === "ddl") { var dl = parseDateValue(row[i]); if (dl) setOnce("ddl", dl); }
          else if (key === "quoteAmount") { var am = parseAmountValue(row[i]); if (am) setOnce("quoteAmount", am.amount, am.currency); }
          else if (key === "totalManDays") { var md = parseManDaysValue(row[i]); if (md) setOnce("totalManDays", md); }
          break;
        }
      }
      row.forEach(function (cell) { scanInline(normalizeCellText(cell)); });
    });
    // 横排式：表头行含字段标签，值在同一列的数据行
    var labelRe = new RegExp("^(?:" + SCHEDULE_LABEL_RE + ")$", "i");
    var colHits = {};
    (rows || []).forEach(function (row) {
      (row || []).forEach(function (cell, ci) {
        var t = normalizeCellText(cell);
        if (labelRe.test(t)) {
          var k = matchFieldLabel(t);

        }
      });
    });
    (rows || []).forEach(function (row) {
      Object.keys(colHits).forEach(function (ci) {
        var key = colHits[ci];
        var v = (row || [])[Number(ci)];
        if (normalizeCellText(v) === "") return;
        if (key === "dispatchDate") { var ds = parseDateValue(v); if (ds) setOnce("dispatchDate", ds); }
        else if (key === "ddl") { var dl = parseDateValue(v); if (dl) setOnce("ddl", dl); }
        else if (key === "quoteAmount") { var am = parseAmountValue(v); if (am) setOnce("quoteAmount", am.amount, am.currency); }
        else if (key === "totalManDays") { var md = parseManDaysValue(v); if (md) setOnce("totalManDays", md); }
      });
    });

  }
  function parseScheduleFile(f, cb) {
    var name = (f.name || "").toLowerCase();
    var ext = name.split(".").pop();
    if (["xlsx", "xls", "csv"].indexOf(ext) < 0) { cb(null); return; }
    if (!window.XLSX) { cb(null); return; }
    try {
      var b64 = String(f.dataUrl || "").split(",")[1];
      if (!b64) { cb(null); return; }
      var bin = atob(b64);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var wb = XLSX.read(arr, { type: "array", codepage: 65001 });
      var ws = wb.Sheets[wb.SheetNames[0]];
      if (!ws) { cb(null); return; }
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
      cb(extractSchedule(rows));
    } catch (e) { cb(null); }
  }

  /* ================= 附件在线预览 ================= */

    // A) 横向表头：一行内出现 >=2 个银行类标签，标签所在列下方数据行取值
    var labelRow = -1, labelCols = { payee: -1, bank: -1, acc: -1, swift: -1 };
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r] || [];
      var found = { payee: -1, bank: -1, acc: -1, swift: -1 }, cnt = 0;
      for (var c = 0; c < row.length; c++) {
        var k = gridTagKind(row[c]);
        if (k && found[k] < 0) { found[k] = c; cnt++; }
      }
      if (cnt >= 2) { labelRow = r; labelCols = found; break; }
    }
    if (labelRow >= 0) {
      for (var rr = labelRow + 1; rr < rows.length && rr < labelRow + 12; rr++) {
        var drow = rows[rr] || [];
        if (labelCols.payee >= 0 && !out.payeeName) {
          var pv = goodPayeeName(gridCellText(drow[labelCols.payee]));
          if (pv) out.payeeName = pv;
        }
        if (labelCols.bank >= 0 && !out.bankName) {
          var bv = goodBankName(gridCellText(drow[labelCols.bank])) || goodEnglishBankName(gridCellText(drow[labelCols.bank]));
          if (bv) out.bankName = bv;
        }
        if (labelCols.acc >= 0 && !out.bankAccount) {
          var av = cleanAccountAny(gridCellText(drow[labelCols.acc]));
          if (av) out.bankAccount = av;
        }
        if (labelCols.swift >= 0 && !out.swiftCode) {
          var sv = goodSwiftCode(gridCellText(drow[labelCols.swift]));
          if (sv) out.swiftCode = sv;
        }
        if (out.payeeName && out.bankName && out.bankAccount) break;
      }
      // 横向表头结果仅在"开户行"列提取到有效银行名时采信（银行名特征强，防表头误命中）
      if (out.bankName && (out.payeeName || out.bankAccount)) return out;
    }
    // B) 纵向：某行 = 标签 + 相邻值（强标签优先扫一轮，弱标签兜底一轮）
    var STRONG_PAYEE_TAG_RE = /(收款人全称|收款人名称|账户名|账户名称|开户名|开户名称|开户户名|户名)/;
    function scanVertical(strongOnly) {
      for (var r2 = 0; r2 < rows.length; r2++) {
        var row2 = (rows[r2] || []).map(gridCellText);
        for (var c2 = 0; c2 < row2.length; c2++) {
          var k2 = gridTagKind(row2[c2]);
          if (!k2) continue;
          if (k2 === "payee") {
            var isStrong = STRONG_PAYEE_TAG_RE.test(row2[c2].replace(/[：:\s]/g, ""));
            if (strongOnly && !isStrong) continue;
            if (!strongOnly && isStrong) continue; // 强标签轮已处理过
          }
          var val = "";
          for (var c3 = c2 + 1; c3 < row2.length; c3++) {
            if (gridTagKind(row2[c3])) break;
            if (row2[c3]) { val = row2[c3]; break; }
          }
          if (!val) continue;
          if (k2 === "payee" && !out.payeeName) { var pv2 = goodPayeeName(val); if (pv2) out.payeeName = pv2; }
          else if (k2 === "bank" && !out.bankName) { var bv2 = goodBankName(val) || goodEnglishBankName(val); if (bv2) out.bankName = bv2; }
          else if (k2 === "acc" && !out.bankAccount) { var av2 = cleanAccountAny(val); if (av2) out.bankAccount = av2; }
          else if (k2 === "swift" && !out.swiftCode) { var sv2 = goodSwiftCode(val); if (sv2) out.swiftCode = sv2; }
        }
        if (out.payeeName && out.bankName && out.bankAccount) return true;
      }
      return false;
    }
    if (!scanVertical(true)) scanVertical(false);
    return out;
  }
  function parseContractFile(f, cb) {
    var ext = String(f.name || "").toLowerCase().split(".").pop();
    var b64 = String(f.dataUrl || "").split(",")[1] || "";
    function go(b64) {
      parseWithBytes(ext, b64, cb);
    }
    if (b64) { go(b64); return; }
    if (f.storagePath && hasCloudStorage()) {
      cloud.storage.runtime.download(f.storagePath).then(function (res) {
        if (res.error || !res.data) { cb(null); return; }
        var blob = res.data;
        var r = new FileReader();
        r.onload = function () {
          var b2 = String(r.result || "").split(",")[1] || "";
          go(b2);
        };
        r.onerror = function () { cb(null); };
        r.readAsDataURL(blob);
      }).catch(function () { cb(null); });
      return;
    }
    cb(null);
  }
  function parseWithBytes(ext, b64, cb) {
    if (!b64) { cb(null); return; }
    function bytes() {
      var bin = atob(b64);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }
    function finish(text, bankOverride) {
      if (!text) { cb({ noText: true }); return; }
      // 多协议文档（保密协议+外包制作框架合作）：主体与日期优先取"外包制作框架"标题之后的正文
      var ft = focusFrame(text);
      var strict = (ft !== text);
      var jia = extractParty(ft, "甲方") || extractParty(text, "甲方");
      var yi = extractParty(ft, "乙方") || extractParty(text, "乙方");
      // 日期：框架部分优先；不足时全文兜底合并（日期常写在标题之前的合同信息表；内部已排除保密上下文）
      var dates = extractContractDates(ft);
      if (strict) {
        var fullD = extractContractDates(text);
        if (!dates.startDate) dates.startDate = fullD.startDate;
        if (!dates.endDate) dates.endDate = fullD.endDate;
      }
      // 收款信息：框架部分优先；不足时全文兜底（提取内部已做乙方归属检查与甲方名排除）
      var exclude = jia ? [jia] : [];
      var bank = bankOverride || extractBankInfo(ft, exclude);
      if (strict && (!bank.payeeName || !bank.bankName || !bank.bankAccount || !bank.swiftCode)) {
        var fullB = extractBankInfo(text, exclude);
        if (!bank.payeeName) bank.payeeName = fullB.payeeName;
        if (!bank.bankName) bank.bankName = fullB.bankName;
        if (!bank.bankAccount) bank.bankAccount = fullB.bankAccount;
        if (!bank.swiftCode) bank.swiftCode = fullB.swiftCode;
      }
      // OCR 扫描件：乙方主体常识别不全（如「郑州数学黎」），而收款段落质量高——收款人全称即乙方账号名称，用它兜底
      if (bank.payeeName && /(公司|工作室|团队|中心|事务所|研究院|集团|厂|店|社)/.test(bank.payeeName)) {
        if (!yi || (yi.length <= 12 && !/(公司|工作室|团队|中心|事务所|研究院|集团|厂|店|社)/.test(yi))) {
          yi = bank.payeeName;
        }
      }
      if (!jia && !yi && !dates.startDate && !dates.endDate && !bank.payeeName && !bank.bankName && !bank.bankAccount && !bank.swiftCode) { cb({ noFields: true }); return; }
      cb({ ourParty: jia, supplierParty: yi, startDate: dates.startDate, endDate: dates.endDate, payeeName: bank.payeeName, bankName: bank.bankName, bankAccount: bank.bankAccount, swiftCode: bank.swiftCode });
    }
    if (["txt", "md", "log"].indexOf(ext) >= 0) {
      finish(decodeTextBytes(bytes()));
    } else if (["xlsx", "xls", "csv"].indexOf(ext) >= 0) {
      try {
        var wb = XLSX.read(bytes(), { type: "array", codepage: 65001 });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
        var text = rows.map(function (r) { return r.join(" "); }).join("\n");
        var gBank = extractBankFromGrid(rows);
        var tBank = extractBankInfo(focusFrame(text));
        finish(text, {
          payeeName: gBank.payeeName || tBank.payeeName,
          bankName: gBank.bankName || tBank.bankName,
          bankAccount: gBank.bankAccount || tBank.bankAccount,
          swiftCode: gBank.swiftCode || tBank.swiftCode
        });
      } catch (e) { cb({ parseFail: true }); }
    } else if (ext === "docx") {
      docxText(bytes()).then(function (text) {
        if (text == null) { cb({ parseFail: true }); return; } // zip/XML 解析失败（文件损坏或格式特殊）
        finish(text);
      });
    } else if (ext === "pdf") {
      pdfText(bytes()).then(function (text) {
        if (text) { finish(ocrCompact(text)); return; }
        // 扫描件 PDF（无文字层）：用 OCR 识别图片后走同一管线
        if (window.Tesseract && window.pdfjsLib) {
          toast("检测到扫描件 PDF，正在 OCR 识别文字（约需 30-60 秒），请稍候…");
          ocrPdfText(bytes()).then(function (ocrText) {
            if (!ocrText) { cb({ scanPdf: true }); return; }
            finish(ocrCompact(ocrText));
          });
        } else {
          cb({ scanPdf: true });
        }
      });
    } else if (["doc", "wps", "pages"].indexOf(ext) >= 0) {
      cb({ unsupported: ext });
    } else {
      cb({ unsupported: ext });
    }
  }

  function starWidget(val, onChange) {
    var wrap = el("div", "stars");
    var cur = Number(val) || 0;
    function draw() {
      wrap.innerHTML = "";
      for (var i = 1; i <= 5; i++) {
        (function (n) {
          var s = el("span", "star" + (n <= cur ? " on" : ""), "★");
          s.addEventListener("click", function () { cur = n; onChange(cur); draw(); });
          wrap.appendChild(s);
        })(i);
      }
    }
    draw();
    return wrap;
  }
